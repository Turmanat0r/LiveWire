<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LiveWire Handle Generator</title>
<style>
  :root {
    --ink: #17140F;
    --red: #B3272D;
    --off-white: #F3EFE6;
    --gray: #857E70;
    --gray-light: #D9D3C4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--off-white);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--gray);
    margin-bottom: 10px;
  }
  h1 {
    font-size: 22px;
    font-weight: 400;
    margin: 0 0 6px;
    color: var(--off-white);
  }
  .sub {
    font-size: 14px;
    color: var(--gray);
    margin: 0 0 36px;
    line-height: 1.5;
  }
  .handle-box {
    border: 1px solid var(--gray-light);
    border-radius: 2px;
    padding: 40px 20px;
    margin-bottom: 22px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: rgba(255,255,255,0.02);
  }
  .handle {
    font-size: 28px;
    line-height: 1.3;
    color: var(--off-white);
    word-break: break-word;
  }
  .handle .accent {
    color: var(--red);
  }
  .row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font-family: Georgia, serif;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: opacity 0.15s ease;
  }
  button:active { opacity: 0.75; }
  .primary {
    background: var(--red);
    color: var(--off-white);
    border-color: var(--red);
  }
  .secondary {
    background: transparent;
    color: var(--off-white);
    border-color: var(--gray-light);
  }
  .copied {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--red);
    margin-top: 14px;
    height: 14px;
  }
  .angler-id {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--gray);
    margin-top: 8px;
  }
  .card.wide { max-width: 640px; }
  .list-wrap {
    display: none;
    text-align: left;
    border: 1px solid var(--gray-light);
    border-radius: 2px;
    margin-top: 22px;
    max-height: 420px;
    overflow-y: auto;
    background: rgba(255,255,255,0.02);
  }
  .list-wrap.open { display: block; }
  .list-wrap ol {
    margin: 0;
    padding: 14px 18px 14px 42px;
    font-size: 15px;
    line-height: 2;
  }
  .list-wrap li {
    color: var(--off-white);
  }
  .list-wrap li::marker {
    font-family: 'Courier New', monospace;
    color: var(--gray);
    font-size: 12px;
  }
  .count-note {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--gray);
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="card wide">
  <div class="eyebrow">LIVEWIRE &middot; TOURNAMENT REGISTRATION</div>
  <h1>Get your competitor handle</h1>
  <p class="sub">Every angler gets a random handle at sign-up — fish crossed with rock, river, tackle box, or drive-thru menu, served with a straight face.</p>

  <div class="handle-box">
    <div class="handle" id="handleText"></div>
  </div>

  <div class="row">
    <button class="primary" id="rerollBtn">Reroll handle</button>
    <button class="secondary" id="copyBtn">Copy</button>
    <button class="secondary" id="batchBtn">Show 100 handles</button>
  </div>
  <div class="copied" id="copiedMsg"></div>

  <div class="list-wrap" id="listWrap">
    <ol id="handleList"></ol>
  </div>
  <div class="count-note" id="countNote"></div>
</div>

<script>
const titles = [
  "Captain", "Sir", "Doc", "Lord", "Deputy", "The Right Honorable",
  "Reverend", "Professor", "Colonel", "General", "Chief", "The Notorious",
  "Commodore", "Warden", "Judge", "Ambassador", "Marshal", "Baron",
  "The Honorable", "Detective", "Sergeant", "Governor"
];

const adjectives = [
  "Sneaky", "Grumpy", "Wobbly", "Feral", "Rogue", "Salty", "Lucky",
  "Reckless", "Soggy", "Rowdy", "Chaotic", "Stubborn", "Slippery",
  "Mighty", "Legendary", "Wandering", "Cranky", "Jolly", "Sly",
  "Sedimental", "Fossilized", "Petrified", "Igneous", "Molten",
  "Weathered", "Unbothered", "Overqualified", "Suspiciously Calm",
  "Feisty", "Ornery", "Restless", "Waterlogged", "Windburnt",
  "Overcaffeinated", "Unlicensed", "Self-Appointed", "Undeterred",
  "Bewildered", "Vengeful", "Nocturnal", "Barnacled", "Crusty",
  "Formerly Respectable", "Mildly Feral", "Certified", "Unsupervised"
];

const geo = [
  "Granite", "Boulder", "Shale", "Basalt", "Quartz", "Obsidian",
  "Bedrock", "Canyon", "Ridge", "Fossil", "Pyrite", "Slate",
  "Gravel", "Cobble", "Talus", "Moraine", "Feldspar", "Schist",
  "Limestone", "Sediment", "Cliffside", "Riverstone", "Mica",
  "Sandstone", "Dolomite", "Gneiss", "Magma", "Silt", "Chert",
  "Alluvium", "Bluff", "Outcrop", "Scree", "Tundra", "Permafrost",
  "Butte", "Mesa", "Glacier", "Tectonic", "Sedimentary"
];

const fish = [
  "Walleye", "Bass", "Pike", "Catfish", "Perch", "Sturgeon", "Trout",
  "Muskie", "Crappie", "Carp", "Gar", "Herring", "Salmon", "Bluegill",
  "Sucker", "Chub", "Minnow", "Grayling", "Kokanee", "Ling", "Sunfish",
  "Northern", "Burbot", "Whitefish", "Shiner", "Darter", "Bullhead",
  "Smallmouth", "Largemouth", "Cisco", "Goldeye", "Sauger", "Redhorse"
];

const suffixes = [
  "McFin", "Esq.", "Jr.", "the Third", "of the Ponds", "of Canyon Ferry",
  "the Relentless", "the Unbothered", "the Elder", "the Persistent",
  "the Undefeated (Probably)", "the Overpacked", "of the Silos",
  "the Sunburnt", "the Overprepared", "the Chronically Early",
  "the Reigning Champion (Self-Declared)", "the Well-Anchored",
  "the Suspiciously Confident", "the Locally Feared", "of Third Place",
  "the Bait-Rich", "the Underfunded", "the Overinsured"
];

const bait = [
  "Spinnerbait", "Crankbait", "Jerkbait", "Chatterbait", "Wacky Rig",
  "Drop Shot", "Jig", "Spoon", "Swimbait", "Topwater", "Bobber",
  "Nightcrawler", "Leech", "Rooster Tail", "Rapala", "Powerbait",
  "Treble Hook", "Gulp Minnow", "Rubber Worm", "Buzzbait"
];

const waters = [
  "Canyon Ferry", "Yellowstone", "Missouri River", "Bitterroot",
  "Clark Fork", "Flathead Lake", "Hauser Lake", "Holter Lake",
  "Madison River", "Gallatin River", "Big Hole River", "Fort Peck",
  "Georgetown Lake", "Hebgen Lake", "Noxon Reservoir", "Smith River",
  "Blackfoot River", "Rock Creek", "Beaverhead", "Tongue River",
  "Ruby River"
];

const fastFood = [
  "Whopper", "Big Mac", "McNugget", "Baconator", "Frosty", "Crunchwrap",
  "Gordita", "Chalupa", "Doritos Locos", "Waffle Fry", "McFlurry",
  "Drive-Thru", "Value Meal", "Extra Crispy", "Biggie Size",
  "Dollar Menu", "Curly Fry", "Footlong", "Spicy Chicken Sandwich",
  "Junior Bacon"
];

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateHandle() {
  const pattern = Math.floor(Math.random() * 8);
  let parts;

  if (pattern === 0) {
    // Adjective + Geo + Fish
    parts = [pick(adjectives), pick(geo), pick(fish)];
  } else if (pattern === 1) {
    // Fish + Surname (Geo prefixed with Mc-style suffix)
    parts = [pick(fish), pick(suffixes)];
  } else if (pattern === 2) {
    // Title + Adjective + Fish
    parts = [pick(titles), pick(adjectives), pick(fish)];
  } else if (pattern === 3) {
    // Geo + Fish + Suffix
    parts = [pick(geo), pick(fish), pick(suffixes)];
  } else if (pattern === 4) {
    // Bait + Fish
    parts = [pick(bait), pick(fish)];
  } else if (pattern === 5) {
    // Water body + Fish
    parts = [pick(waters), pick(fish)];
  } else if (pattern === 6) {
    // Fast food + Fish
    parts = [pick(fastFood), pick(fish)];
  } else {
    // Title + Bait/Water/FastFood (mixed) + Fish + Suffix
    const flavor = pick([bait, waters, fastFood, geo]);
    parts = [pick(titles), pick(flavor), pick(fish), pick(suffixes)];
  }

  return parts.join(" ");
}

function render() {
  const handle = generateHandle();
  const el = document.getElementById("handleText");
  const words = handle.split(" ");
  el.innerHTML = words
    .map((w, i) => (i === words.length - 1 && !w.includes("(") ? `<span class="accent">${w}</span>` : w))
    .join(" ");
  document.getElementById("copiedMsg").textContent = "";
  return handle;
}

let currentHandle = render();

document.getElementById("rerollBtn").addEventListener("click", () => {
  currentHandle = render();
});

document.getElementById("copyBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(currentHandle).then(() => {
    document.getElementById("copiedMsg").textContent = "Copied \u2014 " + currentHandle;
  }).catch(() => {
    document.getElementById("copiedMsg").textContent = currentHandle;
  });
});

const listWrap = document.getElementById("listWrap");
const batchBtn = document.getElementById("batchBtn");
let batchOpen = false;

batchBtn.addEventListener("click", () => {
  batchOpen = !batchOpen;
  if (batchOpen) {
    const seen = new Set();
    let attempts = 0;
    while (seen.size < 100 && attempts < 5000) {
      seen.add(generateHandle());
      attempts++;
    }
    const handles = Array.from(seen);
    document.getElementById("handleList").innerHTML = handles
      .map(h => `<li>${h}</li>`)
      .join("");
    document.getElementById("countNote").textContent =
      handles.length + " unique handles \u2014 pool size is well into the thousands, this is just a sample.";
    listWrap.classList.add("open");
    batchBtn.textContent = "Hide list";
  } else {
    listWrap.classList.remove("open");
    batchBtn.textContent = "Show 100 handles";
  }
});
</script>

</body>
</html>
