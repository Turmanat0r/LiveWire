# Every push, to any branch, runs the checks below; a pull request shows the
# results for its branch. A red X there means do not merge; the job name says
# which kind of check failed.
#
# After a merge to main, and only if every check passed, the last jobs apply
# any new database changes to the staging database (livewire-staging), then to
# production, and only then publish the live site (docs/SWITCH-OVER.md).
# "Run workflow" on main does the same by hand.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces checks still running on a branch, but never
  # interrupts main, where a database change may be part-way through applying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  parity:
    name: Rules match the old app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The old app (Turmanat0r/Live-Wire), at the commit production runs, as
      # the oracle. Removed at switch-over along with tests/parity.
      - uses: actions/checkout@v5
        with:
          repository: Turmanat0r/Live-Wire
          ref: 9788664d19633d00e8c078e3aaad63216e8adc7d
          path: legacy
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Build the old app
        working-directory: legacy
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run test:parity
        env:
          LEGACY_APP_JS: ${{ github.workspace }}/legacy/app/livewire.js

  phones:
    name: Emulated Android and iPhone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A throwaway Supabase on this machine, with every migration applied.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Point the app and the tests at it
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          # The throwaway stack's admin key, for making the director's account
          # in the director's tests. Masked anyway, so it never shows in a log.
          secret="$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' "$RUNNER_TEMP/supabase.json")"
          echo "::add-mask::$secret"
          {
            echo "VITE_SUPABASE_URL=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium webkit
      # The built app, signed in to that Supabase, on both phones.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  database:
    name: Database rules on real Supabase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A throwaway Supabase on this machine, with every migration applied.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Point the app and the tests at it
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          # The throwaway stack's admin key, for making director accounts in the
          # adapter's tests. Masked anyway, so it never shows in a log.
          secret="$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' "$RUNNER_TEMP/supabase.json")"
          echo "::add-mask::$secret"
          {
            echo "VITE_SUPABASE_URL=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      # The same tests that run on a PC against the stand-in, here against the
      # real thing, so the two cannot quietly disagree.
      - name: Database tests
        run: npm run test:db
      # The app's own server adapter: sign-in, refusals, photos, live signals.
      - name: Server adapter tests
        run: npm run test:remote

  deploy-staging:
    name: Apply database changes to staging
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, parity, phones, database]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # STAGING_DB_URL is the staging database's session-pooler connection
      # string, password included. It reaches that one database and nothing
      # else in the Supabase account. See README, "Database".
      - name: Check the staging address is set
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "::error title=No staging address::Add the STAGING_DB_URL secret. See README, Database."
            exit 1
          fi
      - name: What will change
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: npx supabase db push --db-url "$STAGING_DB_URL" --dry-run
      - name: Apply it
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: npx supabase db push --db-url "$STAGING_DB_URL" --yes

  deploy-production:
    name: Apply database changes to production, then publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [deploy-staging]
    runs-on: ubuntu-24.04
    permissions:
      # Moves the production branch, which the live site is built from.
      contents: write
    steps:
      # PRODUCTION_DB_URL is the production database's session-pooler
      # connection string. Until it is added at switch-over, nothing here
      # touches production.
      - name: Is production set up yet?
        id: ready
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: |
          if [ -z "$PRODUCTION_DB_URL" ]; then
            echo "::notice title=Production not set up yet::No PRODUCTION_DB_URL secret, so nothing went to production. See docs/SWITCH-OVER.md."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.set == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: steps.ready.outputs.set == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.ready.outputs.set == 'true'
        run: npm ci
      - name: What will change
        if: steps.ready.outputs.set == 'true'
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: npx supabase db push --db-url "$PRODUCTION_DB_URL" --dry-run
      - name: Apply it
        if: steps.ready.outputs.set == 'true'
        env:
          PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: npx supabase db push --db-url "$PRODUCTION_DB_URL" --yes
      # The live site's Vercel project builds the production branch, so moving
      # it only now means the live app never calls a database function that is
      # not there yet. A plain push: re-running an old run cannot move the live
      # site backwards, because the branch is already ahead of it.
      - name: Publish the live site
        if: steps.ready.outputs.set == 'true'
        run: git push origin HEAD:refs/heads/production
