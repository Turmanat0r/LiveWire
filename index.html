<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Catch, photo and release scoring for kayak fishing tournaments"
    />
    <meta name="theme-color" content="#24404d" />
    <link rel="icon" type="image/png" href="/icons/livewire-192.png" />
    <link rel="apple-touch-icon" href="/icons/livewire-192.png" />
    <title>LiveWire</title>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!--
      Shown until the app draws over it. If the app never arrives (no signal on
      a first visit, a failed download) this is what stays on screen, and it
      says what to do instead of leaving a blank page. Needs no JavaScript.
    -->
    <div id="root">
      <p class="boot-note">
        LiveWire is loading. If this message stays, check your signal and open the app again.
      </p>
    </div>
    <noscript>LiveWire needs JavaScript turned on in this browser.</noscript>
  </body>
</html>
